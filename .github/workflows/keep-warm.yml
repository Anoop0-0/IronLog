name: Keep API warm

# Render's free tier stops the service after ~15 minutes without traffic,
# and the next request pays the restart. Measured cold: 21.4s, against
# ~0.3s warm — so the first action of any session hung for twenty seconds.
#
# Pinging on a schedule keeps it up. Deliberately not 24/7: a free Render
# service has a monthly instance-hour allowance, and staying awake around
# the clock would consume nearly all of it, leaving nothing if another
# service is ever added. 00:00–19:00 UTC is 05:30–00:30 IST, which covers
# any plausible gym hour and still parks the service overnight.
#
# The API pinged is whichever one the deployed app actually calls, read
# out of the live bundle rather than written down here. Hardcoding it
# went wrong once already: this was pointed at the new Singapore service
# while VITE_API_URL still sent the app to Oregon, so the service every
# request hit was the one service nothing was keeping awake, and users
# paid a cold start that the workflow's green ticks hid completely.
#
# Only one service is pinged, deliberately — a free account's monthly
# instance-hour allowance does not cover two kept awake all day.
#
# GitHub's scheduled runs are best-effort and can be late, so an
# occasional cold start will still slip through. This makes them rare
# rather than guaranteed.

on:
  schedule:
    - cron: '*/10 0-19 * * *'
  workflow_dispatch:       # so it can be kicked manually

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-latest
    steps:
      - name: Find the API the live app calls
        id: api
        run: |
          set -o pipefail
          app=https://iron-log-anoop0-0s-projects.vercel.app
          bundle=$(curl -sf --max-time 30 "$app/" \
            | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          base=$(curl -sf --max-time 30 "$app$bundle" \
            | grep -o 'https://[a-z0-9.-]*\.onrender\.com/api' | head -1)

          # a failed scrape must not silently stop pinging: fall back to
          # the last known service and say so loudly in the log
          if [ -z "$base" ]; then
            base=https://ironlog-hgm2.onrender.com/api
            echo "::warning::could not read the API URL from the bundle; using $base"
          fi
          echo "url=$base/health" >> "$GITHUB_OUTPUT"
          echo "pinging $base/health"

      - name: Wake the API
        run: |
          # generous timeout: if this ping is the one paying the cold
          # start, it needs to outlast the restart rather than fail and
          # leave the service asleep for the next real request
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 120 \
            '${{ steps.api.outputs.url }}')
          echo "HTTP $code"
          cat /tmp/body
          echo
          test "$code" = "200"
