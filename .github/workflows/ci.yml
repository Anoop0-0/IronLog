name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  server:
    name: Server — boot smoke test + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Syntax check every source file
        run: find src -name '*.js' -not -name '*.test.js' -print0 | xargs -0 -n1 node --check
      # npm test includes src/smoke.test.js, which loads every module and
      # boots the app on an ephemeral port. The check above only parses —
      # it passes an import of a name that doesn't exist, which is how a
      # server that couldn't boot once got through. No database needed:
      # index.js connects only when it is the entrypoint.
      - run: npm test
